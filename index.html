<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>国际油价五年走势</title>
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page:           #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --muted:          #898781;
    --grid:           #e1e0d9;
    --axis:           #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --series-wti:     #2a78d6;
    --series-brent:   #eb6834;
    --good:           #006300;
    --critical:       #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page:           #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --muted:          #898781;
      --grid:           #2c2c2a;
      --axis:           #383835;
      --border:         rgba(255,255,255,0.10);
      --series-wti:     #3987e5;
      --series-brent:   #d95926;
      --good:           #0ca30c;
      --critical:       #e66767;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); }
  body {
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 24px 16px 40px;
  }
  .viz-root {
    max-width: 880px;
    margin: 0 auto;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--text-secondary);
    font-size: 13px;
    margin: 0 0 20px;
  }

  .stat-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat-tile {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .stat-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    flex: none;
  }
  .stat-value {
    font-size: 26px;
    font-weight: 600;
    font-variant-numeric: proportional-nums;
  }
  .stat-value .unit {
    font-size: 13px;
    font-weight: 400;
    color: var(--text-secondary);
    margin-left: 4px;
  }
  .stat-delta {
    font-size: 13px;
    margin-top: 4px;
    font-weight: 500;
  }
  .stat-delta.down { color: var(--critical); }
  .stat-delta.up { color: var(--good); }

  .chart-card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 16px 8px;
  }
  .legend {
    display: flex;
    gap: 18px;
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 8px;
    padding-left: 4px;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch { width: 12px; height: 2px; border-radius: 1px; }

  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .axis-line { stroke: var(--axis); stroke-width: 1; }
  .axis-label { fill: var(--muted); font-size: 11px; }
  .line-wti { fill: none; stroke: var(--series-wti); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .line-brent { fill: none; stroke: var(--series-brent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .end-dot { stroke: var(--surface-1); stroke-width: 2; }
  .crosshair { stroke: var(--axis); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0; }
  .hover-dot { stroke: var(--surface-1); stroke-width: 2; opacity: 0; }

  .tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    opacity: 0;
    transition: opacity 0.08s;
    white-space: nowrap;
    z-index: 5;
  }
  .tooltip .t-date { color: var(--text-secondary); margin-bottom: 4px; }
  .tooltip .t-row { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
  .tooltip .t-row + .t-row { margin-top: 2px; }
  .tooltip .t-name { display: flex; align-items: center; gap: 5px; color: var(--text-secondary); }
  .tooltip .t-val { font-weight: 600; font-variant-numeric: tabular-nums; margin-left: 14px; }

  .chart-wrap { position: relative; }

  .note {
    font-size: 12px;
    color: var(--muted);
    margin-top: 14px;
    line-height: 1.6;
  }
  .footer-meta {
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
  }
</style>
</head>
<body>
<div class="viz-root">
  <h1>国际原油价格走势(近五年)</h1>
  <p class="subtitle">WTI 与布伦特原油每日收盘价 · 2026-08-07 至 2026-08-07</p>

  <div class="stat-row">
    <div class="stat-tile">
      <div class="stat-label"><span class="dot" style="background:var(--series-wti)"></span>WTI 原油(美国)</div>
      <div class="stat-value" id="wti-latest">--<span class="unit">美元/桶</span></div>
      <div class="stat-delta" id="wti-delta">--</div>
    </div>
    <div class="stat-tile">
      <div class="stat-label"><span class="dot" style="background:var(--series-brent)"></span>布伦特原油(欧洲基准)</div>
      <div class="stat-value" id="brent-latest">--<span class="unit">美元/桶</span></div>
      <div class="stat-delta" id="brent-delta">--</div>
    </div>
  </div>

  <div class="chart-card">
    <div class="legend">
      <div class="legend-item"><span class="legend-swatch" style="background:var(--series-wti)"></span>WTI 原油</div>
      <div class="legend-item"><span class="legend-swatch" style="background:var(--series-brent)"></span>布伦特原油</div>
    </div>
    <div class="chart-wrap" id="chart-wrap">
      <svg id="chart" viewBox="0 0 820 340" preserveAspectRatio="none"></svg>
      <div class="tooltip" id="tooltip"></div>
    </div>
  </div>

  <p class="note">数据来源:Yahoo Finance(WTI/布伦特原油期货连续合约,近似现货价)。图表历史数据截至 2026-08-07。上方两个统计卡片为 2026-08-07 最新报价,由 GitHub Actions 每日自动抓取更新,过程不经过 AI。</p>
  <p class="footer-meta">页面由 GitHub Actions 定时任务自动生成,最后更新于 2026-08-07 03:52 UTC。</p>
</div>

<script>
const data = [["2026-08-07",78.0,83.38]];

const wtiLatestLive = 78.0, wtiDeltaPct = -2.91;
const brentLatestLive = 83.38, brentDeltaPct = 1.08;

document.getElementById('wti-latest').innerHTML = wtiLatestLive.toFixed(2) + '<span class="unit">美元/桶</span>';
document.getElementById('brent-latest').innerHTML = brentLatestLive.toFixed(2) + '<span class="unit">美元/桶</span>';

function setDelta(el, pct) {
  const dir = pct < 0 ? 'down' : 'up';
  const arrow = pct < 0 ? '↓' : '↑';
  el.textContent = `${arrow} ${Math.abs(pct).toFixed(2)}% 较前一交易日`;
  el.classList.add(dir);
}
setDelta(document.getElementById('wti-delta'), wtiDeltaPct);
setDelta(document.getElementById('brent-delta'), brentDeltaPct);

const svg = document.getElementById('chart');
const W = 820, H = 340;
const M = { top: 16, right: 16, bottom: 30, left: 44 };
const plotW = W - M.left - M.right;
const plotH = H - M.top - M.bottom;

const prices = data.flatMap(d => [d[1], d[2]]);
const yMin = Math.floor(Math.min(...prices) / 10) * 10;
const yMax = Math.ceil(Math.max(...prices) / 10) * 10;

const n = data.length;
const x = i => M.left + (i / (n - 1)) * plotW;
const y = v => M.top + plotH - ((v - yMin) / (yMax - yMin)) * plotH;

function ns(tag) { return document.createElementNS('http://www.w3.org/2000/svg', tag); }

const ySteps = 5;
for (let i = 0; i <= ySteps; i++) {
  const val = yMin + (i / ySteps) * (yMax - yMin);
  const gy = y(val);
  const line = ns('line');
  line.setAttribute('x1', M.left); line.setAttribute('x2', W - M.right);
  line.setAttribute('y1', gy); line.setAttribute('y2', gy);
  line.setAttribute('class', 'gridline');
  svg.appendChild(line);
  const label = ns('text');
  label.setAttribute('x', M.left - 8); label.setAttribute('y', gy + 4);
  label.setAttribute('text-anchor', 'end');
  label.setAttribute('class', 'axis-label');
  label.textContent = '$' + Math.round(val);
  svg.appendChild(label);
}

let lastYear = null;
data.forEach((d, i) => {
  const year = d[0].slice(0, 4);
  if (year !== lastYear) {
    const gx = x(i);
    const label = ns('text');
    label.setAttribute('x', gx); label.setAttribute('y', H - M.bottom + 18);
    label.setAttribute('text-anchor', 'start');
    label.setAttribute('class', 'axis-label');
    label.textContent = year;
    svg.appendChild(label);
    lastYear = year;
  }
});

const axisLine = ns('line');
axisLine.setAttribute('x1', M.left); axisLine.setAttribute('x2', W - M.right);
axisLine.setAttribute('y1', H - M.bottom); axisLine.setAttribute('y2', H - M.bottom);
axisLine.setAttribute('class', 'axis-line');
svg.appendChild(axisLine);

function pathFor(idx) {
  return data.map((d, i) => `${i === 0 ? 'M' : 'L'} ${x(i).toFixed(2)} ${y(d[idx]).toFixed(2)}`).join(' ');
}

const pathWti = ns('path');
pathWti.setAttribute('d', pathFor(1));
pathWti.setAttribute('class', 'line-wti');
svg.appendChild(pathWti);

const pathBrent = ns('path');
pathBrent.setAttribute('d', pathFor(2));
pathBrent.setAttribute('class', 'line-brent');
svg.appendChild(pathBrent);

function endDot(idx, color) {
  const i = n - 1;
  const dot = ns('circle');
  dot.setAttribute('cx', x(i)); dot.setAttribute('cy', y(data[i][idx]));
  dot.setAttribute('r', 4);
  dot.setAttribute('fill', color);
  dot.setAttribute('class', 'end-dot');
  svg.appendChild(dot);
}
endDot(1, 'var(--series-wti)');
endDot(2, 'var(--series-brent)');

const crosshair = ns('line');
crosshair.setAttribute('y1', M.top); crosshair.setAttribute('y2', H - M.bottom);
crosshair.setAttribute('class', 'crosshair');
svg.appendChild(crosshair);

const hoverWti = ns('circle');
hoverWti.setAttribute('r', 4);
hoverWti.setAttribute('fill', 'var(--series-wti)');
hoverWti.setAttribute('class', 'hover-dot');
svg.appendChild(hoverWti);

const hoverBrent = ns('circle');
hoverBrent.setAttribute('r', 4);
hoverBrent.setAttribute('fill', 'var(--series-brent)');
hoverBrent.setAttribute('class', 'hover-dot');
svg.appendChild(hoverBrent);

const overlay = ns('rect');
overlay.setAttribute('x', M.left); overlay.setAttribute('y', M.top);
overlay.setAttribute('width', plotW); overlay.setAttribute('height', plotH);
overlay.setAttribute('fill', 'transparent');
svg.appendChild(overlay);

const wrap = document.getElementById('chart-wrap');
const tooltip = document.getElementById('tooltip');

function handleMove(evt) {
  const rect = svg.getBoundingClientRect();
  const scaleX = W / rect.width;
  const mx = (evt.clientX - rect.left) * scaleX;
  let idx = Math.round(((mx - M.left) / plotW) * (n - 1));
  idx = Math.max(0, Math.min(n - 1, idx));

  const gx = x(idx);
  crosshair.setAttribute('x1', gx); crosshair.setAttribute('x2', gx);
  crosshair.style.opacity = 1;

  hoverWti.setAttribute('cx', gx); hoverWti.setAttribute('cy', y(data[idx][1]));
  hoverWti.style.opacity = 1;
  hoverBrent.setAttribute('cx', gx); hoverBrent.setAttribute('cy', y(data[idx][2]));
  hoverBrent.style.opacity = 1;

  const d = data[idx];
  tooltip.innerHTML = `
    <div class="t-date">${d[0]}</div>
    <div class="t-row"><span class="t-name"><span class="dot" style="background:var(--series-wti)"></span>WTI</span><span class="t-val">$${d[1].toFixed(2)}</span></div>
    <div class="t-row"><span class="t-name"><span class="dot" style="background:var(--series-brent)"></span>布伦特</span><span class="t-val">$${d[2].toFixed(2)}</span></div>
  `;
  tooltip.style.opacity = 1;

  const wrapRect = wrap.getBoundingClientRect();
  const pxX = (gx / W) * wrapRect.width;
  const pxY = (y(Math.max(d[1], d[2])) / H) * wrapRect.height;
  let left = pxX + 14;
  if (left + 150 > wrapRect.width) left = pxX - 150;
  tooltip.style.left = left + 'px';
  tooltip.style.top = Math.max(0, pxY - 50) + 'px';
}

overlay.addEventListener('mousemove', handleMove);
overlay.addEventListener('touchmove', (e) => { handleMove(e.touches[0]); }, { passive: true });
overlay.addEventListener('mouseleave', () => {
  crosshair.style.opacity = 0;
  hoverWti.style.opacity = 0;
  hoverBrent.style.opacity = 0;
  tooltip.style.opacity = 0;
});
</script>
</body>
</html>
